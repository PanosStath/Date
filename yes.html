<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>yes 💖</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: url("background.jpg") no-repeat center center fixed;
    background-size: cover;
}

.container {
    max-width: 700px;
    margin: 20px;
    padding: 30px;
    background: rgba(101, 67, 33, 0.88);
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 8px 25px rgba(0,0,0,0.25);
}

h1 { color: #1f4d3a; }

p { color: #6d6a6a; font-size: 18px; }

button {
    margin-top: 20px;
    padding: 12px 25px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    background: #7d8f69;
    color: white;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
}
</style>
</head>

<body>

<div class="container">

    <h1>ΤΕΛΕΙΑΑΑ🫶🫶🫶</h1>

    <p>
        Αυτό ήθελα να δω 🥰<br>
        Τα λέμε τότε.<br>
        Ανυπομονώ ήδη 💕😘
    </p>

    <button onclick="window.location.href='index.html'">
        Πίσω
    </button>

</div>

</body>
</html>
